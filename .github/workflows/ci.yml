name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest test_data_prep.py -v

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 data_prep.py train_model.py main.py --max-line-length=110 --extend-ignore=E203
